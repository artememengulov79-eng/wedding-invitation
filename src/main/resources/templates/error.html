<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<section class="error-section">
    <h1 class="error-title">Что-то пошло не так</h1>
    <p class="error-message" th:text="${error}">Произошла непредвиденная ошибка</p>
    <a href="/" class="map-button">Вернуться на главную</a>
</section>

</body>
</html>
