<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список гостей</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>

<section class="admin-section">
    <h1 class="admin-title">Список гостей</h1>

    <div th:if="${success}" class="success-message" style="margin-bottom: 2rem;">
        <span th:text="${success}"></span>
    </div>

    <div class="stats" th:if="${!guests.isEmpty()}">
        <div class="stat-item">
            <span class="stat-number" th:text="${guests.size()}">0</span>
            <span class="stat-label">анкет</span>
        </div>
        <div class="stat-item">
            <span class="stat-number" th:text="${#aggregates.sum(guests.![guestCount])}">0</span>
            <span class="stat-label">гостей всего</span>
        </div>
    </div>

    <div class="admin-actions" th:if="${!guests.isEmpty()}">
        <form th:action="@{/admin/clear}" method="post" onsubmit="return confirm('Вы уверены, что хотите удалить всех гостей? Это действие нельзя отменить.');">
            <button type="submit" class="clear-button">Очистить список гостей</button>
        </form>
    </div>

    <div class="guests-list">
        <div th:each="guest : ${guests}" class="guest-card">
            <div class="guest-name" th:text="${guest.name}">Имя</div>
            <div class="guest-details">
                <span th:text="${guest.guestCount} + ' чел.'">1 чел.</span>
                <span class="alcohol-list">
                    <span th:if="${guest.alcoholPreference != null}">
                        <span th:each="alcohol, iterStat : ${#strings.arraySplit(guest.alcoholPreference, ',')}">
                            <span th:switch="${alcohol}">
                                <span th:case="'wine'">🍷 Вино</span>
                                <span th:case="'champagne'">🥂 Шампанское</span>
                                <span th:case="'whiskey'">🥃 Крепкие</span>
                                <span th:case="'none'"> Безалк.</span>
                                <span th:case="*">Не указано</span>
                            </span>
                            <span th:if="${!iterStat.last}">, </span>
                        </span>
                    </span>
                    <span th:if="${guest.alcoholPreference == null}">Не указано</span>
                </span>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(guests)}" class="no-guests">
            Пока никто не подтвердил участие
        </div>
    </div>
</section>

</body>
</html>
